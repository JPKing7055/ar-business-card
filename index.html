<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>司順瑋 Bernie｜AR 名片</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* 不要設背景色：MindAR 的鏡頭畫面在 z-index:-2，body 背景會把它蓋住，畫面就變全黑 */
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; justify-content: center;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      pointer-events: none;
    }
    #talk {
      pointer-events: auto;
      min-height: 48px; padding: 0 22px; border: 0; border-radius: 24px;
      background: #e0814a; color: #10262d; font-size: 16px; font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      opacity: 0; transform: translateY(12px); transition: opacity .3s, transform .3s;
    }
    #talk.show { opacity: 1; transform: none; }
    #talk:disabled { background: #b9a88f; }
    #debug {
      position: fixed; left: 8px; top: 8px; z-index: 20; display: none;
      padding: 6px 8px; border-radius: 6px; background: rgba(0,0,0,.7); color: #9f9;
      font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="debug"></div>
  <div id="ui">
    <button id="talk" type="button" disabled>👋 跟我打招呼</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; warmupTolerance: 3"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="av-idle" src="./avatar/idle.webp" crossorigin="anonymous">
      <img id="av-talking" src="./avatar/talking.webp" crossorigin="anonymous">
      <img id="av-greet" src="./avatar/greet.webp" crossorigin="anonymous">
      <img id="av-greet-talking" src="./avatar/greet_talking.webp" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Card coordinates: width = 1, height = 90/54 ≈ 1.667, centre = (0,0), +Z points out of the card. -->
    <a-entity id="anchor" mindar-image-target="targetIndex: 0">
      <!-- darken the printed portrait a little while the character is out -->
      <a-plane id="dim" width="1" height="1.667" position="0 0 0.001"
               material="color: #000; opacity: 0; transparent: true; shader: flat; depthWrite: false"
               animation__on="property: material.opacity; to: 0.35; dur: 400; startEvents: dimon"
               animation__off="property: material.opacity; to: 0; dur: 200; startEvents: dimoff"></a-plane>

      <!-- base point where the character stands -->
      <a-entity id="base" position="0 -0.3 0.02">
        <a-circle radius="0.32" scale="1 0.45 1" position="0 0 -0.015"
                  material="color: #000; opacity: 0.35; transparent: true; shader: flat; depthWrite: false"></a-circle>

        <!-- yaw: turns around the card normal to face the viewer -->
        <a-entity id="yaw" face-viewer>
          <!-- tilt: stands the character up from the card -->
          <a-entity id="tilt">
            <a-entity id="pop" scale="0.001 0.001 0.001"
                      animation__in="property: scale; from: 0.001 0.001 0.001; to: 1 1 1; dur: 700; easing: easeOutElastic; elasticity: 500; startEvents: popin">
              <a-plane class="pose" data-pose="idle" width="0.9" height="1.122" position="0 0.561 0"
                       material="src: #av-idle; transparent: true; shader: flat; side: double" visible="false"></a-plane>
              <a-plane class="pose" data-pose="talking" width="0.9" height="1.122" position="0 0.561 0"
                       material="src: #av-talking; transparent: true; shader: flat; side: double" visible="false"></a-plane>
              <a-plane class="pose" data-pose="greet" width="0.9" height="1.122" position="0 0.561 0"
                       material="src: #av-greet; transparent: true; shader: flat; side: double" visible="true"></a-plane>
              <a-plane class="pose" data-pose="greet_talking" width="0.9" height="1.122" position="0 0.561 0"
                       material="src: #av-greet-talking; transparent: true; shader: flat; side: double" visible="false"></a-plane>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ---------- 備用台詞：錄音無法播放時，用瀏覽器內建語音念這段 ----------
    const INTRO =
      '嗨，我是司順瑋，也可以叫我 Bernie。' +
      '我在做互動體驗和 AI 應用開發，喜歡用遊戲設計的思維，打造會回應你的互動體驗。' +
      '想看更多作品，可以掃名片背面的 QR Code。';

    // ---------- 讓角色站在名片上並轉向觀看者 ----------
    // 名片坐標：+Y = 名片上緣，+Z = 名片正面朝外。
    // - 從正前方看（名片拿起來、或手機在名片正上方）：角色平貼在名片上，頭朝名片上緣，
    //   就像一張正常的圖，不會倒過來。
    // - 名片平放、從下緣斜斜看過去：角色以腳下為支點立起來，並稍微轉向觀看者。
    // 轉向角度限制在 ±MAX_YAW，觀看者在名片上方時也不會整個轉成顛倒。
    const MAX_YAW = THREE.MathUtils.degToRad(60);
    const SMOOTH = 0.15;          // 0~1，越小越平滑
    AFRAME.registerComponent('face-viewer', {
      init() {
        this.cam = new THREE.Vector3();
        this.tilt = document.getElementById('tilt').object3D;
        this.base = document.getElementById('base').object3D;
        this.yaw = 0;
        this.stand = 0;
      },
      tick() {
        const camera = this.el.sceneEl.camera;
        if (!camera || !shown) return;              // 還沒辨識到名片時不計算
        camera.getWorldPosition(this.cam);
        this.base.updateWorldMatrix(true, false);
        this.base.worldToLocal(this.cam);            // camera in card space
        const { x, y, z } = this.cam;
        // 名片還沒定位時矩陣不可逆，會算出 NaN；NaN 一旦進入平滑值就永遠是 NaN，角色會整個消失
        if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) return;
        const elevation = Math.atan2(z, Math.hypot(x, y));   // 90° = 正前方
        // 站起來的角度：正前方 0°（平貼），越斜越立，最多 90°
        const stand = THREE.MathUtils.clamp(Math.PI / 2 - elevation, 0, Math.PI / 2);
        // 轉向：只有在斜看時才轉；正前方時 x, y 很小、方向不穩定，所以權重趨近 0
        const lean = THREE.MathUtils.clamp((Math.PI / 2 - elevation) / (Math.PI / 3), 0, 1);
        // 觀看者在名片上緣那一側時（y > 0），不轉成背對，只做小幅度偏轉，避免 ±180° 來回跳
        const raw = y <= 0 ? Math.atan2(x, -y) : Math.atan2(x, y);
        const yaw = THREE.MathUtils.clamp(raw, -MAX_YAW, MAX_YAW) * lean;
        if (!Number.isFinite(this.yaw)) this.yaw = yaw;
        if (!Number.isFinite(this.stand)) this.stand = stand;
        this.yaw += (yaw - this.yaw) * SMOOTH;
        this.stand += (stand - this.stand) * SMOOTH;
        this.el.object3D.rotation.set(0, 0, this.yaw);
        this.tilt.rotation.set(this.stand, 0, 0);
      }
    });

    // ---------- 狀態切換 ----------
    const poses = [...document.querySelectorAll('.pose')];
    let pose = 'greet';
    function setPose(name) {
      pose = name;
      poses.forEach(p => p.setAttribute('visible', p.dataset.pose === name));
    }

    // ---------- 登場 / 退場 ----------
    const anchor = document.getElementById('anchor');
    const pop = document.getElementById('pop');
    const dim = document.getElementById('dim');
    const talkBtn = document.getElementById('talk');

    // 追蹤偶爾會短暫丟失又找回（光線、反光、手晃）。
    // 丟失時先等 HIDE_DELAY 毫秒，真的找不到才收起角色；在這之內找回就不重播登場。
    const HIDE_DELAY = 800;
    let shown = false;
    let hideTimer = null;

    function showCharacter() {
      shown = true;
      setPose(speaking ? 'talking' : 'greet');
      pop.object3D.scale.set(0.001, 0.001, 0.001);
      pop.emit('popin');
      // 保險：萬一動畫沒播，900ms 後直接把角色放到正常大小
      setTimeout(() => { if (shown && pop.object3D.scale.x < 0.5) pop.object3D.scale.set(1, 1, 1); }, 900);
      dim.emit('dimon');
      talkBtn.disabled = false;
      talkBtn.classList.add('show');
      clearTimeout(window.__settle);
      window.__settle = setTimeout(() => { if (!speaking) setPose('idle'); }, 2500);
    }

    function hideCharacter() {
      shown = false;
      pop.object3D.scale.set(0.001, 0.001, 0.001);
      dim.emit('dimoff');
      talkBtn.classList.remove('show');
      talkBtn.disabled = true;
      stopSpeaking();
    }

    anchor.addEventListener('targetFound', () => {
      clearTimeout(hideTimer);
      if (!shown) showCharacter();
    });

    anchor.addEventListener('targetLost', () => {
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideCharacter, HIDE_DELAY);
    });

    // ---------- 說話：本人錄音 + 嘴巴依音量開合 ----------
    // audio/intro.m4a 是錄音，audio/intro.json 是預先算好的音量曲線（tools/make_voice.py 產生）。
    // 用一般的 <audio> 播放，依播放時間查音量決定張嘴或閉嘴。
    // 錄音載入失敗時，退回瀏覽器內建語音念 INTRO。
    let speaking = false;
    let flap = null;
    let raf = 0;
    const voice = new Audio('./audio/intro.m4a');
    voice.preload = 'auto';
    voice.setAttribute('playsinline', '');
    let envelope = null;
    fetch('./audio/intro.json').then(r => r.ok ? r.json() : null).then(d => { envelope = d; }).catch(() => {});

    function mouthLoop() {
      if (!speaking) return;
      const frameMs = envelope ? envelope.frameMs : 40;
      const f = Math.floor(voice.currentTime * 1000 / frameMs);
      const v = envelope ? (envelope.env[f] || 0) : 0.5;
      // 有聲音時每 2 格（約 80ms）開合一次；停頓時閉嘴
      const open = v > 0.3 && Math.floor(f / 2) % 2 === 0;
      setPose(open ? 'talking' : 'idle');
      raf = requestAnimationFrame(mouthLoop);
    }

    function stopSpeaking() {
      speaking = false;
      cancelAnimationFrame(raf);
      clearInterval(flap);
      voice.pause();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      setPose('idle');
      talkBtn.textContent = '👋 跟我打招呼';
    }

    function startSpeaking() {
      speaking = true;
      talkBtn.textContent = '■ 停止';
    }

    function speakFallback() {
      if (!('speechSynthesis' in window)) { stopSpeaking(); return; }
      const u = new SpeechSynthesisUtterance(INTRO);
      u.lang = 'zh-TW';
      u.rate = 1.05;
      u.onstart = () => {
        startSpeaking();
        let open = false;
        clearInterval(flap);
        flap = setInterval(() => { open = !open; setPose(open ? 'talking' : 'idle'); }, 160);
      };
      u.onend = u.onerror = () => stopSpeaking();
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }

    voice.addEventListener('ended', stopSpeaking);

    talkBtn.addEventListener('click', () => {
      if (speaking) { stopSpeaking(); return; }
      voice.currentTime = 0;
      voice.play()
        .then(() => { startSpeaking(); mouthLoop(); })
        .catch(() => speakFallback());
    });
    // ---------- 除錯資訊：網址加上 ?debug=1 ----------
    if (new URLSearchParams(location.search).has('debug')) {
      const box = document.getElementById('debug');
      box.style.display = 'block';
      const marker = document.createElement('a-box');   // 角色位置的洋紅色小方塊
      marker.setAttribute('width', 0.1); marker.setAttribute('height', 0.1); marker.setAttribute('depth', 0.1);
      marker.setAttribute('position', '0 0.05 0');
      marker.setAttribute('material', 'color: #ff00ff; shader: flat');
      pop.appendChild(marker);
      const imgs = [...document.querySelectorAll('a-assets img')];
      const deg = r => (r * 180 / Math.PI).toFixed(0);
      setInterval(() => {
        const t = document.getElementById('tilt').object3D.rotation.x;
        const y = document.getElementById('yaw').object3D.rotation.z;
        const sc = pop.object3D.scale.x.toFixed(2);
        const vis = poses.filter(p => p.getAttribute('visible')).map(p => p.dataset.pose).join(',') || '-';
        const loaded = imgs.map(i => i.id.replace('av-', '') + ':' + (i.complete ? i.naturalWidth : 'X')).join(' ');
        const mesh = poses[0].getObject3D('mesh');
        const tex = mesh && mesh.material && mesh.material.map ? 'tex ok' : 'no tex';
        box.textContent =
          'shown ' + shown + '  scale ' + sc + '\n' +
          'stand ' + deg(t) + '°  yaw ' + deg(y) + '°\n' +
          'pose ' + vis + '  ' + tex + '\n' + loaded;
      }, 250);
    }
  </script>
</body>
</html>
